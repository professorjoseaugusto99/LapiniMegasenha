<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivinhe a Palavra</title>
  <style>
    /* Paleta de Cores SaaS (Do projeto anterior) */
    :root {
      --bg-body: #f4f6f8;
      --bg-card: #ffffff;
      --text-main: #374151;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      
      --purple-main: #8b5cf6; 
      --purple-dark: #6d28d9; 
      --purple-light: #ede9fe;
      
      --green-mint: #34d399; 
      --red-coral: #fb7185; 
      
      --gray-btn: #ffffff;
      --gray-btn-border: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, sans-serif; }
    
    body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    /* Cartões Base */
    .card { background: var(--bg-card); border-radius: 12px; padding: 40px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); text-align: center; }
    
    h1 { color: var(--purple-dark); font-size: 2.2rem; margin-bottom: 30px; }
    .hidden { display: none !important; }
    
    /* Formulários e botões */
    label { display: block; margin: 20px 0 8px; font-weight: 600; font-size: 1rem; color: var(--text-main); text-align: left; }
    input, select { width: 100%; padding: 14px; border-radius: 6px; border: 1px solid var(--border-color); background: #fafafa; color: var(--text-main); font-size: 1rem; margin-bottom: 10px; transition: 0.2s; }
    input:focus, select:focus { outline: none; border-color: var(--purple-main); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); background: #ffffff; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary { background: var(--purple-main); color: #fff; }
    .btn-primary:hover { background: #7c3aed; }
    
    .btn-secondary { background: var(--gray-btn); color: var(--text-main); border: 1px solid var(--gray-btn-border); font-size: 1rem; margin-top: 20px; padding: 12px; }
    .btn-secondary:hover { background: #f9fafb; }
    
    /* Área de Jogo */
    .header-jogo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
    
    .timer { font-size: 4rem; font-weight: 800; color: var(--purple-dark); line-height: 1; transition: color 0.3s; }
    .timer.perigo { color: var(--red-coral); }
    
    .placar { background: var(--purple-light); border: 1px solid var(--purple-main); color: var(--purple-dark); padding: 10px 20px; border-radius: 25px; font-size: 1.2rem; font-weight: bold; }
    
    .palavra-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; min-height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; padding: 20px; }
    .palavra { font-size: 4.5rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--text-main); word-break: break-word; }
    
    /* Controles de Ação */
    .controles { display: flex; gap: 15px; }
    .btn-pular { background: var(--gray-btn); color: var(--text-main); border: 1px solid var(--gray-btn-border); flex: 1; }
    .btn-pular:hover { background: #f3f4f6; }
    
    .btn-acerto { background: var(--green-mint); color: white; flex: 2; font-size: 1.5rem; }
    .btn-acerto:hover { background: #10b981; }
  </style>
</head>
<body>

  <!-- TELA 1: SETUP -->
  <div id="tela-setup" class="card">
    <h1>⏱️ Adivinhe a Palavra</h1>
    
    <label>Escolha o Tema:</label>
    <select id="select-tema">
      <option value="todas">Tudo Misturado</option>
      <option value="animais">Animais</option>
      <option value="acoes">Ações e Verbos</option>
      <option value="geral">Objetos Gerais</option>
    </select>

    <label>Tempo da Rodada (segundos):</label>
    <input type="number" id="tempo-rodada" value="60" min="10">

    <button class="btn btn-primary" onclick="iniciarJogo()">▶ Começar Jogo</button>
  </div>

  <!-- TELA 2: JOGO -->
  <div id="tela-jogo" class="card hidden">
    
    <div class="header-jogo">
      <div class="timer" id="timer">60</div>
      <div class="placar">Pontos: <span id="pontos">0</span></div>
    </div>
    
    <div class="palavra-box">
      <div class="palavra" id="palavra-display">PREPARADO?</div>
    </div>

    <!-- Botões Durante a Partida -->
    <div class="controles" id="box-controles">
      <button class="btn btn-pular" onclick="pularPalavra()">Pular</button>
      <button class="btn btn-acerto" onclick="acertouPalavra()">✔ Acertou</button>
    </div>
    
    <!-- Botão Fim de Rodada -->
    <button class="btn btn-primary hidden" id="btn-nova-rodada" onclick="proximaRodada()">▶ Iniciar Próxima Rodada</button>
    
    <!-- Voltar ao Menu -->
    <button class="btn btn-secondary" onclick="voltarMenu()">Voltar ao Menu Principal</button>
  </div>

    let bancoBase = [];
    let bancoAtual = [];
    let configTempo = 60;
    let tempoRestante = 0;
    let pontos = 0;
    let intervalo = null;

    // Embaralhamento Matemático Perfeito (Fisher-Yates)
    function embaralhar(arr) {
      let array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function iniciarJogo() {
      const tema = document.getElementById('select-tema').value;
      
      // Carrega o banco selecionado
      if (tema === "animais") bancoBase = bancoAnimais;
      else if (tema === "acoes") bancoBase = bancoAcoes;
      else if (tema === "geral") bancoBase = bancoGeral;
      else bancoBase = [...bancoAnimais, ...bancoAcoes, ...bancoGeral]; // Junta todos se for "Tudo Misturado"

      configTempo = parseInt(document.getElementById('tempo-rodada').value) || 60;
      
      document.getElementById('tela-setup').classList.add('hidden');
      document.getElementById('tela-jogo').classList.remove('hidden');
      
      proximaRodada();
    }

    function proximaRodada() {
      // Zera a pontuação e ajusta a interface
      pontos = 0;
      atualizarPlacar();
      tempoRestante = configTempo;
      
      const timerElement = document.getElementById('timer');
      timerElement.innerText = tempoRestante;
      timerElement.classList.remove('perigo'); // Remove a cor vermelha se tiver
      
      document.getElementById('btn-nova-rodada').classList.add('hidden');
      document.getElementById('box-controles').classList.remove('hidden');
      
      // Prepara e embaralha as palavras
      bancoAtual = embaralhar(bancoBase);
      exibirPalavra();

      // Controle do Relógio
      clearInterval(intervalo);
      intervalo = setInterval(() => {
        tempoRestante--;
        timerElement.innerText = tempoRestante;
        
        // Fica vermelho nos últimos 10 segundos
        if (tempoRestante <= 10) {
          timerElement.classList.add('perigo'); 
        }

        if (tempoRestante <= 0) {
          finalizarRodada();
        }
      }, 1000);
    }

    function exibirPalavra() {
      // Se as palavras embaralhadas acabarem, a gente pega a base original e embaralha de novo!
      if (bancoAtual.length === 0) {
        bancoAtual = embaralhar(bancoBase); 
      }
      document.getElementById('palavra-display').innerText = bancoAtual.pop();
    }

    function acertouPalavra() {
      pontos++;
      atualizarPlacar();
      exibirPalavra();
    }

    function pularPalavra() {
      // Joga a palavra pulada para o final do array caso precise reciclar depois, e exibe uma nova
      const palavraPulada = document.getElementById('palavra-display').innerText;
      bancoAtual.unshift(palavraPulada); 
      exibirPalavra();
    }

    function atualizarPlacar() {
      document.getElementById('pontos').innerText = pontos;
    }

    function finalizarRodada() {
      clearInterval(intervalo);
      document.getElementById('palavra-display').innerText = "FIM DO TEMPO!";
      document.getElementById('box-controles').classList.add('hidden');
      document.getElementById('btn-nova-rodada').classList.remove('hidden');
    }

    function voltarMenu() {
      clearInterval(intervalo);
      document.getElementById('tela-jogo').classList.add('hidden');
      document.getElementById('tela-setup').classList.remove('hidden');
    }
  </script>
